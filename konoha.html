<title>Konoha — Les Chroniques Shinobi</title>
<style>
:root{--ink:#eee4d8;--muted:#c7b9ab;--line:rgba(185,154,121,.35);--green:#9ac18c;--red:#a8292c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0b0909;color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.6;min-height:100vh}
.chronicles-nav{position:fixed;z-index:1000;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:clamp(26px,4.2vw,68px);width:max-content;max-width:calc(100% - 280px);padding:10px 0;background:transparent;border:0;box-shadow:none}
.chronicles-nav-link{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:9px 2px;color:#dfd0bd;text-decoration:none;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1.5px;white-space:nowrap;border:1px solid transparent;transition:color .22s ease,text-shadow .22s ease}
.chronicles-nav-link:after{content:"";position:absolute;inset:-3px -7px;border:1px solid transparent;opacity:0;transform:scale(.96);transition:opacity .22s ease,transform .22s ease,border-color .22s ease;pointer-events:none}
.chronicles-nav-link:hover:after,.chronicles-nav-link:focus-visible:after,.chronicles-nav-link.is-active:after{opacity:1;transform:scale(1);border-color:currentColor}
.chronicles-nav-link:hover,.chronicles-nav-link:focus-visible,.chronicles-nav-link.is-active{color:#fff0d8;text-shadow:0 0 10px currentColor;outline:none}
.nav-konoha{color:var(--green)!important}.nav-suna{color:#e0bd83!important}.nav-bastion{color:#e05a62!important}
.territory-hero{min-height:100svh;position:relative;isolation:isolate;display:flex;align-items:flex-end;overflow:hidden;padding:clamp(32px,7vw,100px)}
.territory-hero:before{content:"";position:absolute;z-index:-2;inset:0;background:url('assets/Village%20shinobi%20sous%20les%20nuages%20%D0%B4%D1%80%D0%B0%D0%BCatiques.png') center 44%/cover no-repeat;filter:grayscale(1) contrast(1.08) brightness(.78)}
.territory-hero:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(0deg,rgba(5,5,5,.92),rgba(5,5,5,.12) 70%),linear-gradient(90deg,rgba(5,5,5,.32),transparent 75%);pointer-events:none}
.territory-copy{max-width:760px;animation:rise .9s ease both}
.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#d5b08b}
h1{font-size:clamp(48px,8vw,100px);line-height:.98;letter-spacing:.04em;margin:12px 0 18px;font-weight:500;text-shadow:0 4px 28px #000}
.subtitle{font-size:clamp(14px,2vw,19px);letter-spacing:.24em;text-transform:uppercase;color:#d9cec2;margin:0}
.description{max-width:620px;color:#d2c5b8;font-size:17px;margin-top:24px}
.back-link{display:inline-flex;margin-top:22px;padding:10px 0;color:var(--green);text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:bold;border-bottom:1px solid rgba(154,193,140,.6)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.chronicles-nav{top:8px;max-width:calc(100% - 20px);width:calc(100% - 20px);gap:clamp(7px,2vw,14px);padding:8px 5px;justify-content:center}.chronicles-nav-link{font-size:9px;letter-spacing:.6px;padding:8px 2px}.territory-hero{padding:28px 22px}.description{font-size:15px}}
@media(max-width:430px){.chronicles-nav{justify-content:flex-start;overflow-x:auto}.chronicles-nav-link{font-size:8px;letter-spacing:.3px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
